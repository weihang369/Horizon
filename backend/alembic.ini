# Alembic for horizon.db. The app runs `upgrade head` at startup (doc 02 §5); `horizon migrate` does it by hand.
# sqlalchemy.url is set at runtime from the Config (data dir), never here.
[alembic]
script_location = %(here)s/horizon/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
